<style>
:root{--bg:#27261F;--fg:#FFFFFD;--base:1080}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Sans JP','Noto Sans CJK JP',sans-serif;height:100%;overflow:hidden}
.stage{position:relative;width:1080px;height:1920px;transform-origin:0 0}
.frame{position:absolute;inset:40px;border:1px solid rgba(255,255,253,.9)}
.frame2{position:absolute;inset:52px;border:1px solid rgba(255,255,253,.45)}
.wrap{position:absolute;inset:52px;padding:120px 84px 100px;box-sizing:border-box;display:flex;flex-direction:column}
.head{display:flex;align-items:center;justify-content:center;gap:22px}
.head .w{font-family:Montserrat,sans-serif;font-weight:300;font-size:58px;letter-spacing:.06em;white-space:nowrap}
.head svg{height:44px;width:auto;fill:var(--fg)}
.greet{margin-top:56px;text-align:center;font-weight:300;font-size:28px;letter-spacing:.22em;line-height:2}
.rule{margin-top:70px;border-top:1px solid rgba(255,255,253,.15)}
.date{margin-top:34px;font-family:Montserrat,sans-serif;font-weight:400;font-size:28px;letter-spacing:.2em}
.list{margin-top:48px;flex:1;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:180px 1fr auto;align-items:baseline;padding:34px 0;border-bottom:1px solid rgba(255,255,253,.12)}
.time{font-family:Montserrat,sans-serif;font-weight:300;font-size:46px;letter-spacing:.02em}
.name{font-size:46px;font-weight:400;letter-spacing:.1em}
.name small{font-size:24px;font-weight:300;margin-left:40px;letter-spacing:.2em}
.place{font-family:Montserrat,sans-serif;font-weight:400;font-size:22px;letter-spacing:.22em}
.list.dense .row{padding:22px 0} .list.dense .time,.list.dense .name{font-size:38px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.empty .en{font-family:Montserrat,sans-serif;font-weight:300;font-size:44px;letter-spacing:.3em}
.empty .ja{font-family:'Noto Sans JP','Noto Sans CJK JP',sans-serif;font-weight:300;font-size:28px;letter-spacing:.3em}
.foot{display:flex;justify-content:center;padding-top:40px}
.foot svg{width:600px;height:auto;fill:var(--fg)}

<script>
const DEMO=[["10:00","七戸","HOME LAB 2F"],["11:00","山本","1F MT ROOM"],["11:30","佐藤","HOME LAB 2F"],["12:00","田中","HOME LAB 1F"],["13:30","鈴木","1F MT ROOM"],["15:00","高橋","HOME LAB 2F"],["16:30","伊藤","1F MT ROOM"]];
const API='https://script.google.com/macros/s/AKfycbwoDsg5Rn7NSjDCUjevWeO-GtQLCx0RxcFyYoBqwJmkJIO6fKzAH7hK-e91P06vSO6C/exec';
const EMPTY_EN='Live Air Life';   // 予約ゼロの日に出す言葉（Montserrat）
const EMPTY_JA='この家で、生きていく。';   // 同・日本語（Noto Sans JP）
const DAYS=["SUNDAY","MONDAY","TUESDAY","WEDNESDAY","THURSDAY","FRIDAY","SATURDAY"];
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);const st=document.getElementById('stage');st.style.transform='translate('+Math.max(0,(innerWidth-1080*s)/2)+'px,'+Math.max(0,(innerHeight-1920*s)/2)+'px) scale('+s+')';}
function render(rows,dateStr){
  const list=document.getElementById('list'); list.innerHTML='';
  document.getElementById('date').textContent=dateStr;
  if(!rows.length){list.innerHTML='<div class="empty"><div class="en">'+esc(EMPTY_EN)+'</div><div class="ja">'+esc(EMPTY_JA)+'</div></div>';return;}
  list.classList.toggle('dense',rows.length>8);
  rows.forEach(r=>{const d=document.createElement('div');d.className='row';
    d.innerHTML='<div class="time">'+esc(r[0])+'</div><div class="name">'+esc(r[1])+'<small>様</small></div><div class="place">'+esc(r[2])+'</div>';list.appendChild(d);});
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function todayStr(){const n=new Date();return n.getFullYear()+'.'+String(n.getMonth()+1).padStart(2,'0')+'.'+String(n.getDate()).padStart(2,'0')+'　'+DAYS[n.getDay()];}
function load(){
  if(location.search.includes('demo')){render(DEMO,'2026.10.06　TUESDAY');return;}
  if(window.google&&google.script){google.script.run.withSuccessHandler(d=>render(d.rows||[],d.date||todayStr())).withFailureHandler(()=>{}).getToday();return;}
  fetch(API+'?json=1&t='+Date.now()).then(r=>r.json()).then(d=>render(d.rows||[],d.date||todayStr())).catch(()=>{});
}
addEventListener('resize',fit);fit();load();setInterval(load,60000);
setInterval(()=>{const h=new Date().getHours();if(h===4)location.reload();},3600000);
</script></body></html>
