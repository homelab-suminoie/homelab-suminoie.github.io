<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>HOME LAB 公開日 お申し込み</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{--ink:#1a1a18;--ash:#7a7670;--stone:#c8c4bc;--line:#e2dfd8;--paper:#f5f3ef;--white:#fdfcfa;--green:#5f7566;--amber:#b08a3e;--red:#a05252;}
  body{font-family:"Hiragino Kaku Gothic ProN","Noto Sans CJK JP",sans-serif;background:var(--paper);color:var(--ink);font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px 60px;}

  header{text-align:center;padding:44px 0 30px;}
  .brand{font-size:10px;letter-spacing:0.38em;color:var(--ash);text-transform:uppercase;margin-bottom:14px;}
  .brandwrap{margin-bottom:16px;}
  .brandwrap .logo{width:168px;max-width:60%;height:auto;display:inline-block;}
  .brandwrap .logo .st0{fill:var(--ink);}
  h1{font-size:21px;font-weight:600;letter-spacing:0.08em;line-height:1.5;}
  h1 small{display:block;font-size:11px;letter-spacing:0.3em;color:var(--ash);font-weight:300;margin-top:9px;}
  .rule{width:26px;height:1px;background:var(--stone);margin:22px auto 0;}

  .event{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:22px 20px;margin-bottom:22px;}
  .event .d{text-align:center;font-size:17px;font-weight:600;letter-spacing:0.05em;padding-bottom:16px;border-bottom:1px solid var(--line);}
  .partline{display:flex;justify-content:space-between;align-items:baseline;padding:11px 2px 0;font-size:14px;}
  .partline .pl{color:var(--ash);font-size:12.5px;letter-spacing:0.08em;}
  .partline .pt{font-weight:600;letter-spacing:0.04em;}

  .note{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:26px;}
  .note h2{font-size:11px;letter-spacing:0.2em;color:var(--ash);font-weight:600;margin-bottom:11px;}
  .note ol{margin:0;padding-left:1.15em;}
  .note li{font-size:13px;line-height:1.85;color:var(--ink);margin-bottom:5px;}
  .note li:last-child{margin-bottom:0;}
  .note .em{background:linear-gradient(transparent 62%, #f2ead8 62%);font-weight:600;}

  .f{margin-bottom:24px;}
  .f > label{display:block;font-size:13px;font-weight:600;letter-spacing:0.04em;margin-bottom:8px;}
  .req{font-size:10px;color:#fff;background:var(--red);border-radius:2px;padding:1px 6px;margin-left:8px;letter-spacing:0.06em;vertical-align:1.5px;}
  .opt{font-size:10px;color:var(--ash);border:1px solid var(--stone);border-radius:2px;padding:0 6px;margin-left:8px;letter-spacing:0.06em;vertical-align:1.5px;}
  .hint{font-size:12px;color:var(--ash);margin-top:6px;line-height:1.7;}
  input[type=text],input[type=tel],input[type=email],input[type=number],select{
    width:100%;border:1px solid var(--stone);border-radius:8px;padding:12px 13px;font-size:16px;
    font-family:inherit;background:var(--white);color:var(--ink);appearance:none;}
  input:focus,select:focus{outline:none;border-color:var(--ink);}

  .parts{display:flex;flex-direction:column;gap:10px;}
  .partcard{border:1px solid var(--stone);border-radius:10px;padding:15px 17px;cursor:pointer;background:var(--white);display:flex;justify-content:space-between;align-items:center;transition:border-color .15s;}
  .partcard .t{font-size:16px;font-weight:600;letter-spacing:0.05em;}
  .partcard .s{font-size:11.5px;color:var(--ash);letter-spacing:0.1em;margin-top:1px;}
  .partcard .mk{width:19px;height:19px;border:1px solid var(--stone);border-radius:50%;flex:none;position:relative;}
  .partcard.on{border-color:var(--ink);background:#fbfaf7;}
  .partcard.on .mk{border-color:var(--ink);}
  .partcard.on .mk:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--ink);}

  .pills{display:flex;gap:9px;}
  .pill{flex:1;text-align:center;border:1px solid var(--stone);border-radius:8px;padding:11px 0;font-size:14px;cursor:pointer;background:var(--white);color:var(--ash);user-select:none;}
  .pill.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600;}

  .guest{border:1px solid var(--line);border-radius:10px;padding:13px 14px 14px;margin-bottom:9px;background:var(--white);}
  .guest .gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
  .guest .gn{font-size:12px;font-weight:600;color:var(--ash);letter-spacing:0.08em;}
  .guest .rm{font-size:11.5px;color:var(--stone);background:none;border:none;cursor:pointer;padding:2px 4px;font-family:inherit;}
  .grow{display:flex;gap:9px;}
  .grow > div:first-child{flex:1.35;}
  .grow > div:last-child{flex:1;position:relative;}
  .grow .unit{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12.5px;color:var(--ash);pointer-events:none;}
  .addbtn{width:100%;border:1px dashed var(--stone);background:none;border-radius:9px;padding:12px;font-size:13.5px;color:var(--ash);cursor:pointer;font-family:inherit;letter-spacing:0.04em;}
  .addbtn:hover{border-color:var(--ash);color:var(--ink);}
  .total{text-align:right;font-size:12.5px;color:var(--ash);margin-top:9px;}
  .total b{color:var(--ink);font-size:15px;font-weight:600;}

  .kids{background:#fbf9f4;border:1px solid #ece5d6;border-radius:8px;padding:11px 13px;font-size:12.5px;color:#7d6a45;line-height:1.75;margin-top:10px;}

  .err{background:#fbf3f2;border:1px solid #e5c9c6;color:var(--red);font-size:13px;border-radius:8px;padding:12px 14px;margin-bottom:16px;display:none;line-height:1.8;}
  .err.show{display:block;}

  .submit{width:100%;border:none;border-radius:9px;padding:17px;font-size:16px;font-weight:600;letter-spacing:0.08em;background:var(--ink);color:#fff;cursor:pointer;font-family:inherit;margin-top:8px;}
  .submit:disabled{background:var(--stone);cursor:wait;}
  .agree{font-size:11.5px;color:var(--ash);text-align:center;margin-top:14px;line-height:1.8;}

  .state{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:40px 24px;text-align:center;}
  .state .ic{font-size:26px;margin-bottom:14px;}
  .state h2{font-size:16px;font-weight:600;letter-spacing:0.06em;margin-bottom:10px;}
  .state p{font-size:13.5px;color:var(--ash);line-height:1.9;}

  .done .no{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:13px 26px;margin:18px 0 20px;background:var(--paper);}
  .done .no .lb{font-size:10px;letter-spacing:0.2em;color:var(--ash);}
  .done .no .v{font-size:23px;font-weight:600;letter-spacing:0.12em;margin-top:2px;}
  .done .flow{text-align:left;background:var(--paper);border-radius:9px;padding:16px 18px;margin-top:8px;}
  .done .flow li{font-size:12.5px;color:var(--ink);line-height:1.85;margin-bottom:6px;}
  .done .flow li:last-child{margin-bottom:0;}

  footer{text-align:center;font-size:10px;color:var(--stone);letter-spacing:0.22em;margin-top:36px;}
  #load{position:fixed;top:0;left:0;right:0;height:2px;background:var(--ink);z-index:99;display:none;animation:p 1s infinite;}
  @keyframes p{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
</style>
</head>
<body>
<div id="load"></div>

    <h1>公開日のご案内<small>OPEN DAY</small></h1>
    <div class="rule"></div>
  </header>

  <div id="app"><div class="state"><p>読み込んでいます…</p></div></div>

  <footer>SUMINOIE / HOME LAB</footer>
</div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbwZ0Ofu-wrSI48kI5Cn_GZJXd8SmaRXz82Lu9B9wkiSrOdsHvhf6drUi9KaF4Jtatd7_w/exec';
var INFO = null, GUESTS = [], KIDS = [];
function phoneTxt(){ return (INFO && INFO.phone) ? INFO.phone : '0120-756-481'; }

function el(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];}); }
function loadOn(){ el('load').style.display='block'; }
function loadOff(){ el('load').style.display='none'; }

function init(){
  loadOn();
  fetch(API + '?api=info')
    .then(function(r){ return r.json(); })
    .then(function(info){ INFO = info; loadOff(); render(); })
    .catch(function(e){ loadOff(); el('app').innerHTML =
      '<div class="state"><div class="ic">⚠</div><h2>読み込めませんでした</h2><p>お手数ですが、時間をおいて再度お試しください。</p></div>'; });
}

function render(){
  if(INFO.phase === 'before'){
    el('app').innerHTML = '<div class="state"><h2>受付開始前です</h2><p>お申し込みの受付は<br><b>'+fmtJ(INFO.applyFrom)+'</b> から開始いたします。<br>もうしばらくお待ちくださいませ。</p></div>';
    return;
  }
  if(INFO.phase === 'closed'){
    el('app').innerHTML = '<div class="state"><h2>受付を終了しました</h2><p>たくさんのお申し込みをありがとうございました。<br>当選された方には '+esc(INFO.callBy)+' までに<br>オーナーズデスクより <b>'+esc(phoneTxt())+'</b> からお電話いたします。</p></div>';
    return;
  }
  el('app').innerHTML = formHtml();
  GUESTS = []; KIDS = [];
  renderGuests(); renderKids();
}

function fmtJ(d){ var p=String(d).split('-'); return p[0]+'年'+Number(p[1])+'月'+Number(p[2])+'日'; }

function formHtml(){
  var partsHtml = INFO.parts.map(function(p){
    return '<div class="partcard" data-v="'+p.id+'" onclick="pickPart(this)">'
         + '<div><div class="t">'+esc(p.label)+'</div><div class="s">'+esc(p.time)+'</div></div>'
         + '<div class="mk"></div></div>';
  }).join('');
  var anyP = INFO.anyPart || { id:'X', label:'どちらでも可' };
  partsHtml += '<div class="partcard" data-v="'+esc(anyP.id)+'" onclick="pickPart(this)">'
         + '<div><div class="t">'+esc(anyP.label)+'</div><div class="s">第1部・第2部いずれかで調整いたします</div></div>'
         + '<div class="mk"></div></div>';

  return ''
  + '<div class="event">'
  +   '<div class="d">'+esc(INFO.dateLabel)+'</div>'
  +   INFO.parts.map(function(p){ return '<div class="partline"><span class="pl">'+esc(p.label)+'</span><span class="pt">'+esc(p.time)+'</span></div>'; }).join('')
  + '</div>'

  + '<div class="note"><h2>お申し込みについて</h2><ol>'
  +   '<li><span class="em">ご応募多数の場合は抽選</span>とさせていただきます。</li>'
  +   '<li>当選された方には、<b>'+esc(INFO.callBy)+'までにオーナーズデスクより <span class="em">'+esc(phoneTxt())+'</span> からお電話</b>いたします。</li>'
  +   '<li><span class="em">お電話にご応答いただいた時点でご予約確定</span>となります。恐れ入りますが、ご連絡がつかない場合は改めて別の方を抽選させていただきます。</li>'
  +   '<li>お申し込みはお一組さま1回までとさせていただきます。</li>'
  + '</ol></div>'

  + '<div class="err" id="errBox"></div>'

  + '<div class="f"><label>ご希望の部<span class="req">必須</span></label>'
  +   '<div class="parts" id="p_part">'+partsHtml+'</div></div>'

  + '<div class="f"><label>代表者さま お名前<span class="req">必須</span></label>'
  +   '<input type="text" id="f_name" placeholder="例：山田 太郎" autocomplete="name"></div>'

  + '<div class="f"><label>お名前（ふりがな）<span class="req">必須</span></label>'
  +   '<input type="text" id="f_kana" placeholder="例：やまだ たろう" autocomplete="off"></div>'

  + '<div class="f"><label>代表者さま 性別・年齢<span class="req">必須</span></label>'
  +   '<div class="grow">'
  +     '<div><select id="f_sex"><option value="">性別を選択</option><option value="女性">女性</option><option value="男性">男性</option><option value="その他">その他</option></select></div>'
  +     '<div><input type="number" id="f_age" inputmode="numeric" min="0" max="120" placeholder="年齢"><span class="unit">歳</span></div>'
  +   '</div></div>'

  + '<div class="f"><label>お電話番号<span class="req">必須</span></label>'
  +   '<input type="tel" id="f_tel" placeholder="09012345678" autocomplete="tel" inputmode="numeric">'
  +   '<div class="hint">当選のご連絡に使わせていただきます。日中つながりやすい番号をご記入ください。</div></div>'

  + '<div class="f"><label>メールアドレス<span class="req">必須</span></label>'
  +   '<input type="email" id="f_email" placeholder="example@mail.com" autocomplete="email" inputmode="email">'
  +   '<div class="hint">受付内容の控えをお送りします。</div></div>'

  + '<div class="f"><label>お住まい（市・区）<span class="req">必須</span></label>'
  +   '<input type="text" id="f_city" placeholder="例：札幌市北区"></div>'

  + '<div class="f"><label>お連れさま（大人）<span class="opt">任意</span></label>'
  +   '<div id="guests"></div>'
  +   '<button type="button" class="addbtn" onclick="addGuest()">＋ 大人のお連れさまを追加する</button></div>'

  + '<div class="f"><label>お子さま<span class="opt">任意</span></label>'
  +   '<div class="hint" style="margin:0 0 8px">ご一緒にお越しになるお子さまがいらっしゃる場合は、年齢をご入力ください。</div>'
  +   '<div id="kids"></div>'
  +   '<button type="button" class="addbtn" onclick="addKid()">＋ お子さまを追加する</button>'
  +   '<div class="total">ご参加人数　<b id="total">1</b> 名さま<span style="font-size:11px">（代表者さまを含む）</span></div>'
  +   '<div class="kids">3歳以下のお子さまは<b>お食事のご用意はございません</b>が、ご一緒にお越しいただけます。</div>'
  + '</div>'

  + '<div class="f"><label>食物アレルギー<span class="req">必須</span></label>'
  +   '<div class="pills" id="p_allergy">'
  +     '<span class="pill on" data-v="なし" onclick="pickPill(\'p_allergy\',this)">なし</span>'
  +     '<span class="pill" data-v="あり" onclick="pickPill(\'p_allergy\',this)">あり</span></div>'
  +   '<input type="text" id="f_allergyDetail" placeholder="例：どなたが・何に（お子さま＝卵 など）" style="display:none;margin-top:10px;"></div>'

  + '<button class="submit" id="btn" onclick="submit()">この内容で申し込む</button>'
  + '<div class="agree">ご記入いただいた情報は、本イベントのご連絡・運営のみに使用いたします。</div>';
}

function pickPart(elm){
  var box = el('p_part');
  Array.prototype.forEach.call(box.querySelectorAll('.partcard'), function(c){ c.classList.remove('on'); });
  elm.classList.add('on');
}
function partVal(){ var on = el('p_part').querySelector('.partcard.on'); return on ? on.dataset.v : null; }

function pickPill(id, elm){
  var box = el(id);
  Array.prototype.forEach.call(box.querySelectorAll('.pill'), function(p){ p.classList.remove('on'); });
  elm.classList.add('on');
  if(id === 'p_allergy') el('f_allergyDetail').style.display = (elm.dataset.v === 'あり') ? 'block' : 'none';
}
function pillVal(id){ var on = el(id).querySelector('.pill.on'); return on ? on.dataset.v : null; }

function addGuest(){
  if(GUESTS.length >= 9){ return; }
  GUESTS.push({ sex:'', age:'' });
  renderGuests();
}
function removeGuest(i){ GUESTS.splice(i,1); renderGuests(); }

function renderGuests(){
  var h = GUESTS.map(function(g,i){
    return '<div class="guest">'
      + '<div class="gh"><span class="gn">お連れさま '+(i+1)+'</span>'
      +   '<button type="button" class="rm" onclick="removeGuest('+i+')">削除</button></div>'
      + '<div class="grow">'
      +   '<div><select onchange="GUESTS['+i+'].sex=this.value">'
      +     '<option value="">性別を選択</option>'
      +     '<option value="女性"'+(g.sex==='女性'?' selected':'')+'>女性</option>'
      +     '<option value="男性"'+(g.sex==='男性'?' selected':'')+'>男性</option>'
      +     '<option value="その他"'+(g.sex==='その他'?' selected':'')+'>その他</option>'
      +   '</select></div>'
      +   '<div><input type="number" inputmode="numeric" min="0" max="120" placeholder="年齢" value="'+esc(g.age)+'" '
      +     'oninput="GUESTS['+i+'].age=this.value"><span class="unit">歳</span></div>'
      + '</div></div>';
  }).join('');
  el('guests').innerHTML = h;
  updTotal();
}
function updTotal(){ el('total').textContent = 1 + GUESTS.length + KIDS.length; }

function addKid(){
  if(KIDS.length >= 9){ return; }
  KIDS.push('');
  renderKids();
}
function removeKid(i){ KIDS.splice(i,1); renderKids(); }
function renderKids(){
  var h = KIDS.map(function(k,i){
    return '<div class="guest">'
      + '<div class="gh"><span class="gn">お子さま '+(i+1)+'</span>'
      +   '<button type="button" class="rm" onclick="removeKid('+i+')">削除</button></div>'
      + '<div class="grow"><div style="flex:1.35;display:flex;align-items:center;font-size:13px;color:var(--ash)">年齢</div>'
      +   '<div><input type="number" inputmode="numeric" min="0" max="17" placeholder="年齢" value="'+esc(k)+'" '
      +     'oninput="KIDS['+i+']=this.value"><span class="unit">歳</span></div>'
      + '</div></div>';
  }).join('');
  el('kids').innerHTML = h;
  updTotal();
}

function submit(){
  var p = {
    part: partVal(),
    name: el('f_name').value.trim(),
    kana: el('f_kana').value.trim(),
    sex: el('f_sex').value,
    age: el('f_age').value.trim(),
    tel: el('f_tel').value.trim(),
    email: el('f_email').value.trim(),
    city: el('f_city').value.trim(),
    guests: GUESTS.map(function(g){ return { sex:g.sex, age:g.age }; }),
    kids: KIDS.slice(),
    allergy: pillVal('p_allergy'),
    allergyDetail: el('f_allergyDetail').value.trim()
  };
  var errs = [];
  if(!p.part) errs.push('ご希望の部をお選びください');
  if(!p.name) errs.push('代表者さまのお名前をご入力ください');
  if(!p.kana) errs.push('お名前（ふりがな）をご入力ください');
  else if(!/^[ぁ-んゔゝゞー\s　]+$/.test(p.kana)) errs.push('ふりがなは、ひらがなでご入力ください');
  if(!p.sex) errs.push('代表者さまの性別をお選びください');
  if(p.age === '' || isNaN(Number(p.age)) || Number(p.age) < 0 || Number(p.age) > 120) errs.push('代表者さまの年齢をご入力ください');
  var tel = p.tel.replace(/[^0-9]/g,'');
  if(!tel) errs.push('お電話番号をご入力ください');
  else if(tel.length < 10 || tel.length > 11) errs.push('お電話番号は10〜11桁でご入力ください');
  if(!p.email) errs.push('メールアドレスをご入力ください');
  else if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(p.email)) errs.push('メールアドレスの形式をご確認ください');
  if(!p.city) errs.push('お住まい（市・区）をご入力ください');
  GUESTS.forEach(function(g,i){
    if(!g.sex) errs.push('お連れさま'+(i+1)+'の性別をお選びください');
    if(g.age === '' || isNaN(Number(g.age))) errs.push('お連れさま'+(i+1)+'の年齢をご入力ください');
  });
  KIDS.forEach(function(k,i){
    if(k === '' || isNaN(Number(k)) || Number(k) < 0 || Number(k) > 17) errs.push('お子さま'+(i+1)+'の年齢をご入力ください（0〜17）');
  });
  if(p.allergy === 'あり' && !p.allergyDetail) errs.push('アレルギーの内容をご入力ください');

  var box = el('errBox');
  if(errs.length){
    box.innerHTML = errs.map(function(e){ return '・'+esc(e); }).join('<br>');
    box.classList.add('show');
    window.scrollTo({ top:0, behavior:'smooth' });
    return;
  }
  box.classList.remove('show');
  el('btn').disabled = true;
  el('btn').textContent = '送信しています…';
  loadOn();

  fetch(API, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(p) })
    .then(function(r){ return r.json(); })
    .then(function(res){
      loadOff();
      if(res && res.ok){ done(res); }
      else {
        el('btn').disabled = false;
        el('btn').textContent = 'この内容で申し込む';
        box.innerHTML = ((res && res.errors) || ['送信できませんでした']).map(function(e){ return '・'+esc(e); }).join('<br>');
        box.classList.add('show');
        window.scrollTo({ top:0, behavior:'smooth' });
      }
    })
    .catch(function(e){
      loadOff();
      el('btn').disabled = false;
      el('btn').textContent = 'この内容で申し込む';
      box.innerHTML = '・通信エラーが発生しました。恐れ入りますが、もう一度お試しください。';
      box.classList.add('show');
    });
}

function done(res){
  el('app').innerHTML =
    '<div class="state done">'
  + '<div class="ic">✓</div>'
  + '<h2>お申し込みを受け付けました</h2>'
  + '<div class="no"><div class="lb">受付番号</div><div class="v">'+esc(res.id)+'</div></div>'
  + '<div class="flow"><ol style="margin:0;padding-left:1.15em">'
  +   '<li>ご応募多数の場合は抽選とさせていただきます。</li>'
  +   '<li>当選された方には <b>'+esc(INFO.callBy)+'まで</b>にオーナーズデスクより <b>'+esc(phoneTxt())+'</b> からお電話いたします。</li>'
  +   '<li>お電話にご応答いただいた時点でご予約確定です。<b>'+esc(phoneTxt())+'</b> からの着信はHOME LABからのご連絡ですので、ご確認をお願いいたします。</li>'
  + '</ol></div>'
  + (res.mailed ? '<p style="margin-top:16px;font-size:12.5px">ご入力のメールアドレス宛に、受付内容の控えをお送りしました。</p>' : '')
  + '</div>';
  window.scrollTo({ top:0, behavior:'smooth' });
}

init();
</script>
</body>
</html>
